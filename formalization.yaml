# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Lower Bounds on Diameter-Preserving Spanning Subgraphs of the Hypercube"
  description: >-
    Unconditional Lean 4 + Mathlib formalization for Graham and Harary's
    hypercube diameter-preserving spanning subgraph problem: proves the
    universal lower bound 2^n + ceil((2^n - 2n)/(n - 1)) <= f(n) for all
    n >= 2, raises the asymptotic second-term coefficient to 3/2 on the scale
    2^n/(n - 1), and certifies 39 <= f(5) <= 40, f(6) >= 76, f(7) >= 150,
    f(8) >= 294, and improved lower bounds through dimension n = 32. Companion
    write-up and prior-work search log (including Google Scholar sweep on
    2026-11-22) are published at
    https://mathdiscoveries.org/results/hypercube-edge-bounds; no priority is
    claimed over unread sources (the full body of Bouabdallah-Delorme-Djelloul
    1995 and Djelloul's 1993 thesis could not be accessed).
  authors:
    - "Tyler B. Hughes"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Tyler B. Hughes"

classification:
  arxiv: ["math.CO"]
  msc2020: ["05C35", "05C12"]

sources:
  - title: "How Few Edges Preserve a Hypercube's Diameter? Exact Conservation Laws and Kernel-Checked Bounds"
    authors:
      - "Tyler B. Hughes"
    id: "https://mathdiscoveries.org/results/hypercube-edge-bounds"
    type: paper
    location: "https://mathdiscoveries.org/results/hypercube-edge-bounds"
    relationship: formalizes
    author_endorsement: participated
    note: >-
      The companion paper. It states and proves in writing every compared
      statement of this package (Theorems 1, 3, 9 and 11, Propositions 12 and
      13), and the Lean work formalizes them; the formalization presents no
      result that the paper does not. The finite certificates behind
      f(6) >= 76 and f(8) >= 294 (Proposition 12) and the bounds for
      17 <= n <= 32 (Theorem 11) are stated and explained in the paper and are
      evaluated in the Lean kernel here. Logged searches across the 1992-2024
      literature and a 5-query Google Scholar sweep (2026-11-22) did not turn
      up a stronger lower bound on f(n); the full body of Bouabdallah, Delorme
      and Djelloul (1995), its 1990 Orsay report and Djelloul's 1993 thesis
      remain unread [to check], so no priority is claimed over them. AI
      research agents built and directed by Tyler B. Hughes generated and
      checked this work. No human mathematician has yet refereed the proof.
  - title: "Changing and unchanging the diameter of a hypercube"
    authors:
      - "Niall Graham"
      - "Frank Harary"
    type: paper
    location: "Discrete Applied Mathematics 37/38 (1992), 265-274"
    relationship: background
    note: "Introduces the diameter-preserving edge-deletion problem on Q_n."
  - title: "Edge deletion preserving the diameter of the hypercube"
    authors:
      - "Abdelaziz Bouabdallah"
      - "Charles Delorme"
      - "S. Djelloul"
    id: "https://doi.org/10.1016/0166-218X(95)00023-K"
    type: paper
    location: "Discrete Applied Mathematics 63 (1995), 91-95"
    relationship: background
    note: "Establishes the classical lower bound on f(n); full body of the 1995 paper was paywalled and unread."
  - title: "Bounded Degree Spanners of the Hypercube"
    authors:
      - "Rajko Nenadov"
      - "Mehtaab Sawhney"
      - "Benny Sudakov"
      - "Adam Zsolt Wagner"
    id: "https://arxiv.org/abs/1910.09868"
    type: paper
    location: "arXiv:1910.09868 (2019)"
    relationship: background
    note: "Related hypercube spanner bounds consulted in the prior-work check (also PatternBoost, arXiv:2411.00566, Section 3.3)."

