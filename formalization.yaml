# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Lower Bounds on Diameter-Preserving Spanning Subgraphs of the Hypercube"
  description: >-
    Unconditional Lean 4 + Mathlib formalization for Graham's hypercube
    diameter-preserving spanning subgraph problem: proves the universal lower
    bound 2^n + ceil((2^n - 2n)/(n - 1)) <= f(n) for all n >= 2, raises the
    asymptotic second-term coefficient to 3/2 on the scale 2^n/(n - 1), and
    certifies 39 <= f(5) <= 40, f(6) >= 76, f(7) >= 150, f(8) >= 294,
    and improved lower bounds through dimension n = 32.
  authors:
    - "Tyler Hughes"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Tyler Hughes"

classification:
  arxiv: ["math.CO"]
  msc2020: ["05C35", "05C12"]

sources:
  - title: "Lower bounds on diameter-preserving spanning subgraphs of the hypercube"
    type: original-proof
    relationship: other
    note: >-
      Distance-ball excess bounds, asymptotic 3/2 theorem, and finite-dimension
      certificates discovered and formalized in Lean 4 by AI research agents
      built and directed by Tyler Hughes; accompanying unrefereed manuscript at
      mathdiscoveries.org.
  - title: "Edge deletion preserving the diameter of the hypercube"
    authors:
      - "Abdelaziz Bouabdallah"
      - "Charles Delorme"
      - "S. Djelloul"
    id: "https://doi.org/10.1016/0166-218X(95)00023-K"
    type: paper
    location: "Discrete Applied Mathematics 63 (1995), 91-95"
    relationship: background
    note: "Establishes the classical lower bound improved here for all n >= 4."

related_formalizations: []

status:
  scope: >-
    Unconditionally proved in Lean 4 + Mathlib with standard axioms only (zero
    sorry, zero native_decide): universal lower bound for all n >= 2, asymptotic
    3/2 excess bound, 39 <= f(5) <= 40, f(6) >= 76, f(7) >= 150,
    f(8) >= 294, and certified lower bounds for dimensions 17 through 32.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]

