fidelity:
  divergences: ""

review:
  status: agent-reviewed
  reviewers:
    - "Internal adversarial falsifier and reviewer agents"
  notes: >-
    Checked by separate internal falsifier and reviewer agents and audited for
    standard axioms only via Hypercube/Verify.lean. Not yet refereed by a human
    mathematician.

alignment:
  namespace: "HypercubeChallenge"
  statements:
    - source: "Universal lower bound for all n >= 2"
      lean: "HypercubeChallenge.theorem1_f_lower_bound_nat"
      module: "Challenge"
      status: proved
      note: "Proves 2^n + ceil((2^n - 2n)/(n - 1)) <= f(n)."
    - source: "Asymptotic 3/2 excess bound"
      lean: "HypercubeChallenge.theorem5_asymptotic_three_halves"
      module: "Challenge"
      status: proved
      note: "Lim inf of (f(n) - 2^n)*(n - 1)/2^n >= 3/2."
    - source: "Dimension 5 bounds 39 <= f(5) <= 40"
      lean: "HypercubeChallenge.f_five_bounds"
      module: "Challenge"
      status: proved
      note: "Rules out 38 edges in Q_5."
    - source: "Dimension 6 lower bound f(6) >= 76"
      lean: "HypercubeChallenge.f_six_ge_76"
      module: "Challenge"
      status: proved
      note: "Kernel-checked integer certificate."
    - source: "Dimension 7 lower bound f(7) >= 150"
      lean: "HypercubeChallenge.f_seven_ge_150"
      module: "Challenge"
      status: proved
      note: "Kernel-checked three-radius certificate."
    - source: "Dimension 8 lower bound f(8) >= 294"
      lean: "HypercubeChallenge.f_eight_ge_294"
      module: "Challenge"
      status: proved
      note: "Kernel-checked integer certificate."
    - source: "Certified lower bounds for dimensions 17 through 32"
      lean: "HypercubeChallenge.theorem14_bounds_17_to_32"
      module: "Challenge"
      status: proved
      note: "Kernel-checked certificates for 17 <= n <= 32."

acknowledgements: "Built on Lean 4 and Mathlib."
